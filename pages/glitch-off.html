<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitch:Off - Cyberpunk Maze Escape</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .play-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
            text-align: center;
        }

        .game-header {
            margin-bottom: 1rem;
        }

        .game-header h2 {
            color: var(--accent-cyan);
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
            text-shadow: 0 0 10px rgba(77, 238, 234, 0.5);
        }

        .game-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* 3D 렌더링 캔버스 컨테이너 */
        #canvas-container {
            position: relative;
            width: 800px;
            height: 450px;
            margin: 0 auto;
            border: 2px solid var(--accent-cyan);
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(77, 238, 234, 0.4);
            overflow: hidden;
            background-color: #05060f;
        }

        #canvas-container:fullscreen {
            width: 100vw;
            height: 100vh;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }

        #canvas-container:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            border: 2px solid rgba(77, 238, 234, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--accent-cyan);
            z-index: 4;
        }

        /* 미니맵 레이더 */
        #minimap {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 180px;
            height: 180px;
            background-color: rgba(5, 6, 15, 0.85);
            border: 2px solid var(--accent-cyan);
            border-radius: 8px;
            z-index: 5;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(77, 238, 234, 0.4);
        }

        /* 플레이 화면 내부 오버레이 UI */
        .game-ui-overlay {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.5rem;
            z-index: 5;
            pointer-events: none;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 1rem;
            text-shadow: 0 0 8px rgba(77, 238, 234, 0.6);
        }

        .ui-badge {
            background: rgba(5, 6, 15, 0.8);
            border: 1px solid var(--accent-cyan);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(77, 238, 234, 0.2);
        }

        #blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(5, 6, 15, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
        }

        #blocker h1 {
            color: var(--accent-cyan);
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 15px rgba(77, 238, 234, 0.6);
        }

        #blocker p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .game-controls-help {
            margin-top: 1rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        #popup-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 11, 26, 0.95);
            border: 2px solid var(--accent-cyan);
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
            z-index: 20;
            box-shadow: 0 0 35px rgba(77, 238, 234, 0.5);
            display: none;
        }

        #popup-box h2 {
            color: var(--accent-cyan);
            font-size: 1.8rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px rgba(77, 238, 234, 0.5);
        }

        #popup-box p {
            color: var(--text-main);
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }

        #popup-btn {
            background-color: var(--accent-cyan);
            color: #05060f;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: opacity 0.2s, box-shadow 0.2s;
        }

        #popup-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px var(--accent-cyan);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <header id="header"></header>

    <main>
        <div class="play-container">
            <div class="game-header">
                <h2>Glitch:Off : Cyberpunk Grid</h2>
                <p>고속으로 추적해오는 고성능 드론들을 피해 메인프레임을 돌파하세요.</p>
            </div>

            <!-- 3D 렌더링 캔버스 및 내장 오버레이 UI -->
            <div id="canvas-container">
                <canvas id="minimap"></canvas>
                <div id="crosshair"></div>
                
                <div class="game-ui-overlay">
                    <div class="ui-badge" id="droneDisplay">DRONES: 0</div>
                    <div class="ui-badge" id="hpDisplay">HP: 100</div>
                    <div class="ui-badge" id="staminaDisplay">STAMINA: 100</div>
                    <div class="ui-badge" id="timerDisplay">TIME: 05:00</div>
                </div>

                <div id="blocker">
                    <h1>CLICK TO START</h1>
                    <p>클릭하여 네온 그리드에 접속하세요</p>
                </div>
                <div id="popup-box">
                    <h2 id="popup-title">탈출 성공!</h2>
                    <p id="popup-desc">성공적으로 미로 메인프레임을 돌파했습니다.</p>
                    <button id="popup-btn" onclick="location.reload()">다시 시작</button>
                </div>
            </div>

            <div class="game-controls-help">
                [WASD] 이동 | [SHIFT] 고속 질주 | [SPACE] 점프 | [F] 전체 화면 | [마우스] 시점 | [클릭] 디버그 탄환 발사
            </div>
        </div>
    </main>

    <footer id="footer"></footer>

    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/menu.js"></script>
    <script src="../js/main.js"></script>

    <script>
        const container = document.getElementById('canvas-container');
        const blocker = document.getElementById('blocker');
        const droneDisplay = document.getElementById('droneDisplay');
        const hpDisplay = document.getElementById('hpDisplay');
        const staminaDisplay = document.getElementById('staminaDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const popupBox = document.getElementById('popup-box');
        const popupTitle = document.getElementById('popup-title');
        const popupDesc = document.getElementById('popup-desc');
        const minimapCanvas = document.getElementById('minimap');
        const ctxMini = minimapCanvas.getContext('2d');

        minimapCanvas.width = 180;
        minimapCanvas.height = 180;

        let scene, camera, renderer;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let isRunning = false;
        let prevTime = performance.now();

        let hp = 100;
        let stamina = 100;
        let caughtDrones = 0;
        let gameActive = false;
        let remainingTime = 300;

        let velocityY = 0;
        let canJump = true;
        const gravity = 25.0;
        const jumpSpeed = 8.0;
        const playerHeight = 1.6;

        let bullets = [];
        let enemies = [];
        let walls = [];
        let portal = null;

        let pitch = 0;
        let yaw = 0;

        const mazeSize = 19;
        const tileSize = 4;
        let mazeMap = [];

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x070814);
            scene.fog = new THREE.FogExp2(0x070814, 0.055);

            camera = new THREE.PerspectiveCamera(70, 800 / 450, 0.1, 1000);
            camera.position.set(tileSize * 1.5, playerHeight, tileSize * 1.5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(800, 450);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x223355, 0.8);
            scene.add(ambientLight);

            const floorGeo = new THREE.PlaneGeometry(80, 80);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x0a0b1c, 
                roughness: 0.4,
                metalness: 0.6,
                emissive: 0x050612,
                emissiveIntensity: 0.3
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.set(40, 0, 40);
            scene.add(floor);

            generateRandomMaze();
            buildMaze();
            createPortal();
            spawnEnemies();

            blocker.addEventListener('click', () => {
                if (gameActive) return;
                renderer.domElement.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === renderer.domElement) {
                    blocker.style.display = 'none';
                    gameActive = true;
                } else {
                    if (popupBox.style.display !== 'block') {
                        blocker.style.display = 'flex';
                        gameActive = false;
                    }
                }
            });

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('click', shootBullet);

            window.addEventListener('resize', onWindowResize);

            setInterval(() => {
                if (gameActive) {
                    remainingTime--;
                    let min = Math.floor(remainingTime / 60);
                    let sec = remainingTime % 60;
                    timerDisplay.innerText = `TIME: ${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;

                    if (remainingTime <= 0) {
                        endGame(false, "시간 초과! 미로 탈출에 실패했습니다.");
                    }
                }
            }, 1000);
        }

        function onWindowResize() {
            if (document.fullscreenElement === container || document.webkitFullscreenElement === container) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            } else {
                camera.aspect = 800 / 450;
                camera.updateProjectionMatrix();
                renderer.setSize(800, 450);
            }
        }

        function generateRandomMaze() {
            mazeMap = Array(mazeSize).fill(0).map(() => Array(mazeSize).fill(1));

            function carve(x, z) {
                mazeMap[z][x] = 0;
                const directions = [
                    {dx: 0, dz: -2}, {dx: 0, dz: 2},
                    {dx: -2, dz: 0}, {dx: 2, dz: 0}
                ].sort(() => Math.random() - 0.5);

                for (let d of directions) {
                    let nx = x + d.dx;
                    let nz = z + d.dz;
                    if (nx > 0 && nx < mazeSize - 1 && nz > 0 && nz < mazeSize - 1 && mazeMap[nz][nx] === 1) {
                        mazeMap[z + d.dz / 2][x + d.dx / 2] = 0;
                        carve(nx, nz);
                    }
                }
            }

            carve(1, 1);
            mazeMap[1][1] = 0;
            mazeMap[1][2] = 0;
            mazeMap[2][1] = 0;
        }

        function buildMaze() {
            const wallGeo = new THREE.BoxGeometry(tileSize, 4, tileSize);
            const wallMat = new THREE.MeshStandardMaterial({ 
                color: 0x131428, 
                roughness: 0.3,
                metalness: 0.7,
                emissive: 0x00aaff,
                emissiveIntensity: 0.25
            });

            for (let z = 0; z < mazeMap.length; z++) {
                for (let x = 0; x < mazeMap[z].length; x++) {
                    if (mazeMap[z][x] === 1) {
                        const wall = new THREE.Mesh(wallGeo, wallMat);
                        wall.position.set(x * tileSize + tileSize / 2, 2, z * tileSize + tileSize / 2);
                        scene.add(wall);
                        walls.push(wall);
                    }
                }
            }
        }

        function createPortal() {
            const portalGeo = new THREE.CylinderGeometry(1.2, 1.2, 4, 32);
            const portalMat = new THREE.MeshStandardMaterial({ 
                color: 0x00ffff, 
                emissive: 0x00ffff,
                emissiveIntensity: 1.2,
                roughness: 0.1
            });
            portal = new THREE.Mesh(portalGeo, portalMat);

            let emptyCells = [];
            for (let z = 2; z < mazeSize - 1; z++) {
                for (let x = 2; x < mazeSize - 1; x++) {
                    if (mazeMap[z][x] === 0 && !(x === 1 && z === 1)) {
                        emptyCells.push({x, z});
                    }
                }
            }
            const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)] || {x: mazeSize - 2, z: mazeSize - 2};
            portal.position.set(randomCell.x * tileSize + tileSize / 2, 2, randomCell.z * tileSize + tileSize / 2);
            scene.add(portal);
        }

        function spawnEnemies() {
            const droneGeo = new THREE.SphereGeometry(0.7, 16, 16);
            const droneMat = new THREE.MeshStandardMaterial({ 
                color: 0xff0055, 
                emissive: 0xff0055,
                emissiveIntensity: 1.2,
                metalness: 0.7
            });

            let emptyCells = [];
            for (let z = 3; z < mazeSize - 2; z++) {
                for (let x = 3; x < mazeSize - 2; x++) {
                    if (mazeMap[z][x] === 0) emptyCells.push({x, z});
                }
            }
            emptyCells.sort(() => Math.random() - 0.5);

            for (let i = 0; i < Math.min(12, emptyCells.length); i++) {
                let cell = emptyCells[i];
                const drone = new THREE.Mesh(droneGeo, droneMat);
                drone.position.set(cell.x * tileSize + tileSize / 2, 1.5, cell.z * tileSize + tileSize / 2);
                
                drone.patrolDir = new THREE.Vector3(
                    Math.random() > 0.5 ? 1 : -1, 
                    0, 
                    Math.random() > 0.5 ? 1 : -1
                ).normalize();
                drone.changeDirTimer = 0;

                scene.add(drone);
                enemies.push(drone);
            }
        }

        function onKeyDown(e) {
            if (e.code === 'KeyF') {
                toggleFullScreen();
                return;
            }

            if (!gameActive) return;
            if (e.code === 'KeyW') moveForward = true;
            if (e.code === 'KeyS') moveBackward = true;
            if (e.code === 'KeyA') moveLeft = true;
            if (e.code === 'KeyD') moveRight = true;
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') isRunning = true;
            if (e.code === 'Space' && canJump) {
                velocityY = jumpSpeed;
                canJump = false;
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        function onKeyUp(e) {
            if (e.code === 'KeyW') moveForward = false;
            if (e.code === 'KeyS') moveBackward = false;
            if (e.code === 'KeyA') moveLeft = false;
            if (e.code === 'KeyD') moveRight = false;
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') isRunning = false;
        }

        document.addEventListener('mousemove', (e) => {
            if (!gameActive) return;
            const movementX = e.movementX || 0;
            const movementY = e.movementY || 0;

            yaw -= movementX * 0.0015;
            pitch -= movementY * 0.0015;
            pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));

            camera.rotation.set(0, 0, 0);
            camera.rotateY(yaw);
            camera.rotateX(pitch);
        });

        function checkWallCollision(pos) {
            const radius = 0.45;
            for (let wall of walls) {
                const dx = Math.abs(pos.x - wall.position.x);
                const dz = Math.abs(pos.z - wall.position.z);
                if (dx < tileSize / 2 + radius && dz < tileSize / 2 + radius) {
                    return true;
                }
            }
            return false;
        }

        function isEnemyVisible(enemy) {
            const pPos = camera.position;
            const ePos = enemy.position;
            const dist = pPos.distanceTo(ePos);

            if (dist > 12) return false;

            const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            const toEnemy = ePos.clone().sub(pPos).normalize();

            const dot = forward.dot(toEnemy);
            if (dot < 0.2) return false; 

            const rayStep = 0.5;
            const steps = Math.floor(dist / rayStep);
            let checkPos = pPos.clone();
            for (let i = 1; i < steps; i++) {
                checkPos.addScaledVector(toEnemy, rayStep);
                if (checkWallCollision(checkPos)) {
                    return false;
                }
            }

            return true;
        }

        function shootBullet() {
            if (!gameActive) return;
            const bulletGeo = new THREE.SphereGeometry(0.2, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);

            bullet.position.copy(camera.position);
            
            const directionVector = new THREE.Vector3();
            camera.getWorldDirection(directionVector);

            bullet.velocity = directionVector.clone().multiplyScalar(2.0);
            scene.add(bullet);
            bullets.push(bullet);
        }

        function drawMinimap() {
            ctxMini.clearRect(0, 0, 180, 180);
            
            const scale = 2.8;
            const centerX = 90;
            const centerY = 90;
            const pPos = camera.position;

            ctxMini.save();
            ctxMini.translate(centerX, centerY);

            ctxMini.fillStyle = '#131428';
            for (let wall of walls) {
                let wx = (wall.position.x - pPos.x) * scale;
                let wz = (wall.position.z - pPos.z) * scale;
                if (Math.abs(wx) < 95 && Math.abs(wz) < 95) {
                    ctxMini.fillRect(wx - (tileSize*scale)/2, wz - (tileSize*scale)/2, tileSize*scale, tileSize*scale);
                }
            }

            if (portal && camera.position.distanceTo(portal.position) < 18.0) {
                let px = (portal.position.x - pPos.x) * scale;
                let pz = (portal.position.z - pPos.z) * scale;
                ctxMini.fillStyle = '#00ffff';
                ctxMini.beginPath();
                ctxMini.arc(px, pz, 5, 0, Math.PI * 2);
                ctxMini.fill();
            }

            for (let en of enemies) {
                if (isEnemyVisible(en)) {
                    let ex = (en.position.x - pPos.x) * scale;
                    let ez = (en.position.z - pPos.z) * scale;
                    ctxMini.fillStyle = '#ff0055';
                    ctxMini.beginPath();
                    ctxMini.arc(ex, ez, 4, 0, Math.PI * 2);
                    ctxMini.fill();
                }
            }

            ctxMini.restore();

            ctxMini.fillStyle = '#00ffff';
            ctxMini.beginPath();
            ctxMini.arc(centerX, centerY, 4.5, 0, Math.PI * 2);
            ctxMini.fill();
        }

        function endGame(isSuccess, message) {
            gameActive = false;
            document.exitPointerLock();
            popupTitle.innerText = isSuccess ? "탈출 성공!" : "시스템 셧다운";
            popupDesc.innerText = message;
            popupBox.style.display = 'block';
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);

            if (gameActive) {
                let currentSpeed = 6.0;
                if (isRunning && stamina > 0 && (moveForward || moveBackward || moveLeft || moveRight)) {
                    currentSpeed = 10.5;
                    stamina = Math.max(0, stamina - 22 * delta);
                } else {
                    stamina = Math.min(100, stamina + 18 * delta);
                }
                staminaDisplay.innerText = `STAMINA: ${Math.floor(stamina)}`;
                if (stamina <= 0) isRunning = false;

                const speed = currentSpeed * delta;
                const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                let moveDir = new THREE.Vector3();
                if (moveForward) moveDir.add(forward);
                if (moveBackward) moveDir.sub(forward);
                if (moveLeft) moveDir.sub(right);
                if (moveRight) moveDir.add(right);
                moveDir.y = 0;

                if (moveDir.lengthSq() > 0) {
                    moveDir.normalize().multiplyScalar(speed);

                    let targetX = camera.position.clone();
                    targetX.x += moveDir.x;
                    if (!checkWallCollision(targetX)) {
                        camera.position.x = targetX.x;
                    }

                    let targetZ = camera.position.clone();
                    targetZ.z += moveDir.z;
                    if (!checkWallCollision(targetZ)) {
                        camera.position.z = targetZ.z;
                    }
                }

                velocityY -= gravity * delta;
                camera.position.y += velocityY * delta;

                if (camera.position.y < playerHeight) {
                    camera.position.y = playerHeight;
                    velocityY = 0;
                    canJump = true;
                }

                for (let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i];
                    b.position.add(b.velocity);

                    if (checkWallCollision(b.position)) {
                        scene.remove(b);
                        bullets.splice(i, 1);
                        continue;
                    }

                    for (let j = enemies.length - 1; j >= 0; j--) {
                        let en = enemies[j];
                        if (b.position.distanceTo(en.position) < 1.0) {
                            scene.remove(en);
                            enemies.splice(j, 1);
                            scene.remove(b);
                            bullets.splice(i, 1);
                            
                            caughtDrones++;
                            droneDisplay.innerText = `DRONES: ${caughtDrones}`;
                            break;
                        }
                    }
                }

                for (let en of enemies) {
                    en.changeDirTimer += delta;
                    let distToPlayer = en.position.distanceTo(camera.position);

                    // 드론 방향 변경 주기를 더 짧게 단축 (민첩성 향상)
                    if (en.changeDirTimer > 2.0 || Math.random() < 0.04) {
                        if (distToPlayer < 18.0) {
                            en.patrolDir.copy(camera.position).sub(en.position).setY(0).normalize();
                        } else {
                            const angles = [0, Math.PI/2, Math.PI, Math.PI*1.5];
                            const randomAngle = angles[Math.floor(Math.random() * angles.length)];
                            en.patrolDir.set(Math.sin(randomAngle), 0, Math.cos(randomAngle));
                        }
                        en.changeDirTimer = 0;
                    }

                    let oldEnPos = en.position.clone();
                    // 기본 순찰 속도 상향 (4.2)
                    en.position.addScaledVector(en.patrolDir, 4.2 * delta);

                    if (checkWallCollision(en.position)) {
                        en.position.copy(oldEnPos);
                        en.patrolDir.negate();
                    }

                    // 플레이어 접근 시 추적 속도 대폭 상향 (4.0)
                    if (distToPlayer < 8.0) {
                        en.lookAt(camera.position);
                        let oldPosBeforeChase = en.position.clone();
                        en.translateZ(4.0 * delta);
                        if (checkWallCollision(en.position)) {
                            en.position.copy(oldPosBeforeChase);
                        }
                    }

                    if (distToPlayer < 1.2) {
                        hp -= 5;
                        hpDisplay.innerText = `HP: ${hp}`;
                        if (hp <= 0) {
                            endGame(false, "드론 공격으로 시스템이 파괴되었습니다.");
                        }
                    }
                }

                if (portal && camera.position.distanceTo(portal.position) < 2.0) {
                    endGame(true, "성공적으로 미로 메인프레임을 돌파했습니다!");
                }

                drawMinimap();
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
